[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rpc-buddy"
version = "0.1.0"
description = "Shows what you play and listen to on Linux as Discord Rich Presence"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "dbus-fast>=5.2,<6",
    "pypresence>=4.6.2,<5",
    "tomli-w>=1.2",
    # Provided by io.qt.PySide.BaseApp inside the Flatpak; keep in sync with its version.
    "PySide6-Essentials>=6.11,<6.12",
]

[project.scripts]
rpc-buddy = "rpc_buddy.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rpc_buddy = ["resources/*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
