name: 🐞 Bug report
description: Something doesn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! If a **game isn't shown** or a **music player isn't detected**, please use the dedicated templates — they ask exactly what's needed.
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
  - type: input
    id: version
    attributes:
      label: RPC Buddy version
      description: "The release you installed, e.g. 0.1.0 — `flatpak run io.github.YetAnotherGerrit.RpcBuddy --version` shows it."
    validations:
      required: true
  - type: dropdown
    id: desktop
    attributes:
      label: Desktop
      options:
        - KDE Plasma
        - GNOME
        - Other (please mention it above)
    validations:
      required: true
  - type: dropdown
    id: discord
    attributes:
      label: How is Discord installed?
      options:
        - Flatpak (com.discordapp.Discord)
        - Flatpak, Discord Canary
        - Package (.deb, .rpm, AUR, …)
        - Snap
        - Other / not sure
    validations:
      required: true
  - type: dropdown
    id: steam
    attributes:
      label: How is Steam installed?
      options:
        - Package (native)
        - Flatpak
        - I don't use Steam
        - Not sure
  - type: textarea
    id: setup-check
    attributes:
      label: What does the setup check show?
      description: Main window → **Run setup check…** — a screenshot, or the text of rows with ⚠.
  - type: textarea
    id: log
    attributes:
      label: Debug output (optional)
      description: |
        Run `flatpak run io.github.YetAnotherGerrit.RpcBuddy --debug` in a terminal, reproduce the problem, and paste the output.
        **It can contain game names, song titles and file paths** — remove what you don't want to share.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I checked the information above and removed anything I don't want to share publicly.
          required: true
